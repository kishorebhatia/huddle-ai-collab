# Lean CI/CD for the agent's prompts:
#   pull request → run the regression set with the PR's brief prompt, log it to Arize as an experiment,
#                  and fail the check if faithfulness or completeness drop below evals/baseline.json
#   push to redesign-v4 → same gate; if it passes, move the `live` branch to this commit and deploy it:
#                  SSH to the EC2 box with a key that can only run aws/autodeploy.sh, which pulls `live`.
#                  So only commits that passed evals ship.
name: evals

on:
  pull_request:
    branches: [redesign-v4]
  push:
    branches: [redesign-v4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Type-check the server and functions
        run: deno check aws/server/main.ts supabase/functions/*/index.ts evals/run.ts evals/gate-tasks.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the UI's JavaScript
        run: for f in web/*.js; do node --check "$f"; done
      - name: Run evals (Arize experiment + gate)
        env:
          HUDDLE_URL: ${{ vars.HUDDLE_URL }}
          EVAL_TOKEN: ${{ secrets.EVAL_TOKEN }}
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
          ARIZE_SPACE_ID: ${{ vars.ARIZE_SPACE_ID }}
        run: deno run -A evals/run.ts
      - name: Run plan and review evals (gate)
        env:
          HUDDLE_URL: ${{ vars.HUDDLE_URL }}
          EVAL_TOKEN: ${{ secrets.EVAL_TOKEN }}
        run: deno run -A evals/gate-tasks.ts
      - name: Promote to live
        if: github.event_name != 'pull_request'
        run: git push --force origin HEAD:refs/heads/live
      - name: Deploy to EC2
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key's forced command runs aws/autodeploy.sh; nothing else is possible with it.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes ec2-user@"$DEPLOY_HOST"
      - name: Check the live site
        if: github.event_name != 'pull_request'
        run: |
          for i in 1 2 3 4 5 6; do curl -fsS "${{ vars.HUDDLE_URL }}/healthz" && exit 0; sleep 10; done
          exit 1
